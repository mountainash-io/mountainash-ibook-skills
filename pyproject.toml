[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "mountainash-ibook-tools"
version = "0.1.0"
description = "Deterministic tools for Mountainash documentation workflows"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]
license-files = ["LICENSE.hiivmind", "docs/license.md"]

[project.scripts]
ibook = "ibook_tools.cli:main"

[project.urls]
Repository = "https://github.com/mountainash-io/mountainash-ibook-skills"

[tool.hatch.build.targets.wheel]
packages = ["src/ibook_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
